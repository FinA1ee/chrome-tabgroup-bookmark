<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>收录标签组</h1>
    <p id="hint">当前窗口的标签组会存成书签文件夹</p>
  </header>

  <main id="list"></main>

  <details id="options">
    <summary>设置</summary>
    <label><input type="checkbox" id="datePrefix"> 文件夹名带日期（YYYY-MM-DD）</label>
    <label><input type="checkbox" id="closeAfterSave"> 收录后关闭该组</label>
    <label class="row">
      <span>归档位置</span>
      <span class="path">书签栏 / <input type="text" id="rootFolder" spellcheck="false"></span>
    </label>
  </details>

  <footer>
    <button id="saveAll" type="button">收录本窗口全部组</button>
  </footer>

  <div id="result" hidden></div>

  <script type="module" src="popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>收录标签组</h1>
    <p id="hint">选择要归档的页面，存成书签文件夹</p>
  </header>

  <main id="list"></main>

  <details id="options">
    <summary>设置</summary>
    <label><input type="checkbox" id="datePrefix"> 文件夹名带日期（YYYY-MM-DD）</label>
    <label><input type="checkbox" id="closeAfterSave"> 归档成功后删除已收录页面</label>
    <label class="form-row">
      <span>归档到</span>
      <select id="destination"></select>
    </label>
    <label class="form-row">
      <span>默认目录</span>
      <span class="path"><span>书签栏 /</span><input type="text" id="rootFolder" spellcheck="false"></span>
    </label>
    <p class="option-hint">选择具体文件夹后，日期子文件夹直接建在该文件夹下；默认目录仅在「归档到」为默认时使用。</p>
  </details>

  <section id="archives-section">
    <div class="section-head">
      <h2>历史归档</h2>
      <button id="refreshArchives" type="button" class="link-button">刷新</button>
    </div>
    <div id="archives"></div>
  </section>

  <footer>
    <button id="saveAll" type="button">收录全部选中</button>
  </footer>

  <div id="result" hidden></div>

  <script type="module" src="popup.js"></script>
</body>
</html>

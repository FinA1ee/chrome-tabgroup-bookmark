<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="heading">
      <h1 data-i18n="appTitle">Tab Group Archiver</h1>
      <p id="hint" data-i18n="appHint">Select pages to archive into bookmarks</p>
    </div>
    <div id="languageSwitch" class="lang-switch" aria-label="Language">
      <button type="button" data-lang="zh" title="中文">中</button>
      <button type="button" data-lang="en" title="English">EN</button>
    </div>
  </header>

  <main id="list"></main>

  <details id="options">
    <summary data-i18n="settingsTitle">Settings</summary>
    <label><input type="checkbox" id="datePrefix"> <span data-i18n="datePrefix">Prefix folder with date (YYYY-MM-DD)</span></label>
    <label><input type="checkbox" id="closeAfterSave"> <span data-i18n="closeAfterSave">Delete archived tabs after saving</span></label>
    <label class="form-row">
      <span data-i18n="archiveTo">Archive to</span>
      <select id="destination"></select>
    </label>
    <label class="form-row">
      <span data-i18n="defaultDir">Default folder</span>
      <span class="path"><span data-i18n="bookmarksBar">Bookmarks bar /</span><input type="text" id="rootFolder" spellcheck="false"></span>
    </label>
    <p class="option-hint" data-i18n="settingsHint">Choose a folder to put dated group folders directly inside it.</p>
  </details>

  <section id="archives-section">
    <div class="section-head">
      <h2 data-i18n="archivesTitle">Archive history</h2>
      <button id="refreshArchives" type="button" class="link-button" data-i18n="refresh">Refresh</button>
    </div>
    <div id="archives"></div>
  </section>

  <footer>
    <button id="saveAll" type="button" data-i18n="archiveAll">Archive all selected</button>
  </footer>

  <div id="result" hidden></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
